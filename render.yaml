services:
  - type: web
    name: ams-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ams-db
          property: connectionString

databases:
  - name: ams-db
    plan: free
    databaseName: ams
    user: postgres
